{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="auth-card shadow-lg">
          <div class="text-center mb-4">
            <i class="fa-solid fa-key auth-icon"></i>
            <h2 class="auth-title">Forgot Password</h2>
            <p class="text-muted">Enter your email and we'll send you a reset link.</p>
          </div>
          <form method="POST">
            <div class="mb-4">
              <label class="form-label">Email ID</label>
              <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="btn btn-gold w-100 rounded-pill py-2">
              <i class="fa-solid fa-paper-plane me-2"></i>Send Reset Link
            </button>
          </form>
          <p class="text-center mt-4 mb-0">
            <a href="{{ url_for('login') }}" class="link-plum"><i class="fa-solid fa-arrow-left me-1"></i>Back to Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
